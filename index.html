<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заказ оборудования BILLZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky category bar, product grid, cart drawer pinned at bottom on phones / side on desktop */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --ink:#15191C; --muted:#61696E; --line:#DDE0DA;
  --accent:#E2530F; --accent-ink:#FFFFFF; --ok:#1F7A4D; --warn:#A8620A; --no:#9B2C2C;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111416; --surface:#1A1E21; --ink:#EEF0EC; --muted:#9AA2A6; --line:#2C3236;
  --accent:#FF7033; --accent-ink:#1A0C04; --ok:#5CC48F; --warn:#E3A44A; --no:#E77B7B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111416; --surface:#1A1E21; --ink:#EEF0EC; --muted:#9AA2A6; --line:#2C3236;
  --accent:#FF7033; --accent-ink:#1A0C04; --ok:#5CC48F; --warn:#E3A44A; --no:#E77B7B; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-bottom:96px}
header{padding:28px 16px 12px;max-width:1180px;margin:0 auto}
h1{font:600 clamp(22px,4vw,32px)/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:65ch}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);flex:none}
.lang button{border:0;background:transparent;color:var(--ink);font:700 13px var(--body);padding:6px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mode{display:inline-flex;margin-top:14px;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.mode button{border:0;background:transparent;color:var(--ink);font:600 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
details{font-size:13px;color:var(--muted)} details summary{cursor:pointer;color:var(--ink);font-weight:600} details ul{margin:6px 0 0;padding-left:18px}
.ask{font:600 14px var(--body);color:var(--muted)}
.add:disabled{background:var(--line);color:var(--muted);cursor:default}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.bar-in::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:16px}
.sec{font:600 15px var(--display);margin:22px 0 10px;display:flex;gap:8px;align-items:baseline}
.sec span{font:500 13px var(--body);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ph{aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:#FFFFFF;display:grid;place-items:center;color:var(--muted);font:500 12px var(--mono)}
.ph img{width:100%;height:100%;object-fit:contain}
.name{font-weight:700;line-height:1.3}
.meta{font:500 12px var(--mono);color:var(--muted)}
.stock{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.stock::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok)} .s-low{color:var(--warn)} .s-no{color:var(--no)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font:600 18px var(--display);font-variant-numeric:tabular-nums}
.add{border:0;background:var(--accent);color:var(--accent-ink);font:700 14px var(--body);padding:9px 14px;border-radius:8px;cursor:pointer}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{border:0;background:transparent;color:var(--ink);width:34px;height:36px;font:700 18px var(--body);cursor:pointer}
.step span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--warn)}
/* cart */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg)}
.cartbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.cartbar b{font:600 18px var(--display);font-variant-numeric:tabular-nums}
.open{border:0;background:var(--accent);color:var(--accent-ink);font:700 15px var(--body);padding:11px 18px;border-radius:8px;cursor:pointer}
.open:disabled{opacity:.45;cursor:default}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none}
.sheet.on{display:flex;justify-content:flex-end}
.panel{background:var(--surface);width:min(460px,100%);height:100%;overflow-y:auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:14px}
.panel h2{font:600 20px var(--display);margin:0}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.line small{color:var(--muted)}
.tot{display:flex;justify-content:space-between;font:600 18px var(--display)}
label{font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:4px}
input,textarea,select{font:15px var(--body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.send{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--accent-ink);font:700 16px var(--body);padding:14px;border-radius:10px}
.send[aria-disabled="true"]{opacity:.45;pointer-events:none}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);font:600 14px var(--body);padding:11px;border-radius:10px;cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:0}
.x{align-self:flex-end;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);cursor:pointer}
footer{max-width:1180px;margin:24px auto 0;padding:0 16px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top"><h1 id="t-h1"></h1><div class="lang" role="group" aria-label="Язык / Til"><button id="l-ru">RU</button><button id="l-uz">UZ</button></div></div>
  <p class="sub" id="t-sub"></p>
  <div class="mode" role="group"><button id="m-fiz"></button><button id="m-yur"></button></div>
</header>
<div class="bar"><div class="bar-in" id="chips"></div></div>
<main id="list"></main>
<footer id="foot"></footer>

<div class="cartbar"><div class="cartbar-in">
  <div><div id="cnt" style="font-size:13px;opacity:.75"></div><b id="sum">$0</b></div>
  <button class="open" id="openCart" disabled></button>
</div></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="ct">
  <div class="panel">
    <button class="x" id="close"></button>
    <h2 id="ct"></h2>
    <div id="lines"></div>
    <div class="tot"><span id="t-tot"></span><span id="tot">$0</span></div>
    <label for="f-shop"><span id="t-shop"></span><input id="f-shop"></label>
    <label for="f-phone"><span id="t-phone"></span><input id="f-phone" type="tel" placeholder="+998"></label>
    <label for="f-addr"><span id="t-addr"></span><input id="f-addr"></label>
    <label for="f-pay"><span id="t-pay"></span><select id="f-pay"><option value="cash"></option><option value="card"></option><option value="bank"></option></select></label>
    <label for="f-inn" id="l-inn" hidden><span id="t-inn"></span><input id="f-inn" inputmode="numeric"></label>
    <label for="f-com"><span id="t-com"></span><textarea id="f-com" rows="2"></textarea></label>
    <button class="open" id="submit" disabled></button>
    <p class="hint" id="hint"></p>
  </div>
</div>

 fiz:"Jismoniy shaxs",yur:"Yuridik shaxs, QQS bilan",all:"Hammasi",inStock:n=>`Mavjud: ${n} dona`,low:" · kam qoldi",order:"Buyurtma asosida, taxminan 1 kun",none:"Mavjud emas",noBtn:"Yo‘q",
 toCart:"Savatga",orderBtn:"Buyurtma",specs:"Xususiyatlari",ask:"Narxi so‘rov bo‘yicha",over:n=>`${n} dona buyurtma asosida, taxminan 1 kunda keltiramiz`,max:n=>`Boshqa yo‘q: jami ${n} dona`,
 empty:"Savat bo‘sh",inCart:n=>`Savatda ${n} dona`,checkout:"Buyurtma berish",yours:"Buyurtmangiz",total:"Jami",close:"Yopish ✕",phone:"Mijoz telefoni",shop:"Mijoz: do‘kon / kompaniya",addr:"Yetkazish manzili",pay:"To‘lov",payO:["Naqd","Payme / Click / karta","O‘tkazma"],submit:"Arizani yuborish",notTg:"Arizani yuborish uchun vitrinani BILLZ boti orqali oching.",inn:"Kompaniya STIR",
 com:"Izoh",comPh:"Shoshilinchmi, hisob-faktura kerakmi va h.k.",send:"Buyurtmani nusxalash va «Buyurtmalar» mavzusini ochish",joinQ:"BILLZ buyurtmalar guruhida hali yo‘qmisiz?",join:"Avval guruhga qo‘shiling",share:"Telegramdagi boshqa chatga yuborish",copy:"Buyurtma matnini nusxalash",copied:"Nusxalandi ✓",copyFail:"Nusxalab bo‘lmadi",
 hintNo:"Mijoz do‘koni va telefonini kiriting.",hintOk:"Ariza buyurtmalar guruhiga yuboriladi, holati sizga botda keladi.",
 each:p=>`1 dona: ${p}`,underOrder:n=>`${n} dona buyurtma asosida`,plusAsk:" + so‘rov bo‘yicha",cartEmpty:"Savat bo‘sh.",
 foot:d=>`Qoldiqlar ${d} holatiga, BILLZ ombori bo‘yicha. Narxlar AQSh dollarida. Yuridik shaxslar uchun narxlar QQS bilan.`,
 oHead:"🛒 BILLZ uskunalar vitrinasidan buyurtma",oFiz:"Xaridor: jismoniy shaxs",oYur:"Xaridor: yuridik shaxs, narxlar QQS bilan",oAsk:"narxi so‘rov bo‘yicha",oUnder:n=>`(${n} dona buyurtma asosida)`,oTot:"Jami",oAskTot:" + narxi so‘rov bo‘yicha pozitsiyalar",
 oName:"Ism",oPhone:"Telefon",oShop:"Do‘kon",oInn:"STIR",oCom:"Izoh"}};
const CAT={"Моноблоки":"Monobloklar","Чековые принтеры":"Chek printerlari","Принтеры этикеток":"Shtrix-kod printerlari","Сканеры":"Skanerlar","Денежные ящики":"Pul qutilari","Весы":"Tarozilar","Расходники":"Sarf materiallari","Для ювелирных магазинов":"Zargarlik do‘konlari uchun"};
const cart={};
let mode="fiz", lang="ru";
const $=s=>document.querySelector(s);
const L=()=>T[lang];
const nm=i=>i.n[lang];
const cn=c=>lang==="uz"?(CAT[c]||c):c;
const price=i=>mode==="yur"?i.yur:i.fiz;
const key=i=>i.sku;
const capped=i=>i.st==="no"; // last units, no restock
const fmt=v=>"$"+(Math.round(v*100)/100).toLocaleString("ru-RU",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cats=[...new Set(ITEMS.map(i=>i.c))];
let cur="*";

function stockHtml(i){
  if(i.q<=0&&i.st==="no") return `<div class="stock s-no">${L().none}</div>`;
  if(i.q<=0) return `<div class="stock s-low">${L().order}</div>`;
  if(i.q<=2) return `<div class="stock s-low">${L().inStock(i.q)}${L().low}</div>`;
  return `<div class="stock s-ok">${L().inStock(i.q)}</div>`;
}
function ctl(i){
  const k=esc(key(i)), n=cart[key(i)]||0;
  if(i.q<=0&&i.st==="no") return `<button class="add" disabled>${L().noBtn}</button>`;
  if(!n) return `<button class="add" data-a="+" data-s="${k}">${i.q>0?L().toCart:L().orderBtn}</button>`;
  const full=capped(i)&&n>=i.q;
  return `<div class="step"><button data-a="-" data-s="${k}" aria-label="−">−</button><span>${n}</span><button data-a="+" data-s="${k}" aria-label="+" ${full?"disabled":""}>+</button></div>`;
}
function renderStatic(){
  document.documentElement.lang=lang;
  const t=L();
  const set=(id,v)=>{$(id).textContent=v};
  set("#t-h1",t.h1);set("#t-sub",t.sub);set("#m-fiz",t.fiz);set("#m-yur",t.yur);set("#openCart",t.checkout);set("#ct",t.yours);set("#t-tot",t.total);set("#close",t.close);
  set("#t-phone",t.phone);set("#t-shop",t.shop);set("#t-addr",t.addr);set("#t-pay",t.pay);set("#t-inn",t.inn);set("#t-com",t.com);set("#submit",t.submit);
  [...$("#f-pay").options].forEach((o,k)=>o.textContent=t.payO[k]);
  $("#f-com").placeholder=t.comPh; $("#foot").textContent=t.foot(STOCK_DATE); document.title=t.h1+" · BILLZ";
  $("#l-ru").setAttribute("aria-pressed",lang==="ru");$("#l-uz").setAttribute("aria-pressed",lang==="uz");
  $("#m-fiz").setAttribute("aria-pressed",mode==="fiz");$("#m-yur").setAttribute("aria-pressed",mode==="yur");$("#l-inn").hidden=mode!=="yur";
}
function renderChips(){
  $("#chips").innerHTML=[["*",L().all],...cats.map(c=>[c,cn(c)])].map(([c,l])=>`<button class="chip" aria-pressed="${c===cur}" data-c="${esc(c)}">${esc(l)}</button>`).join("");
}
function renderList(){
  const show=cur==="*"?cats:[cur];
  $("#list").innerHTML=show.map(c=>{
    const its=ITEMS.filter(i=>i.c===c);
    return `<h2 class="sec">${esc(cn(c))}<span>${its.length}</span></h2><div class="grid">`+its.map(i=>{
      const n=cart[key(i)]||0, p=price(i), sp=i.sp[lang]||[];
      const over=!capped(i)&&n>i.q?n-Math.max(i.q,0):0, full=capped(i)&&n>=i.q&&n>0;
      return `<article class="card">
        <div class="ph">${i.img?`<img src="${i.img}" alt="${esc(nm(i))}" loading="lazy">`:""}</div>
        <div class="name">${esc(nm(i))}</div>
        ${sp.length?`<details><summary>${L().specs}</summary><ul>${sp.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></details>`:""}
        ${stockHtml(i)}
        ${over?`<div class="note">${L().over(over)}</div>`:""}
        ${full?`<div class="note">${L().max(i.q)}</div>`:""}
        <div class="row">${p!=null?`<div class="price">${fmt(p)}</div>`:`<div class="ask">${L().ask}</div>`}${ctl(i)}</div>
      </article>`}).join("")+`</div>`;
  }).join("");
}
function lines(){return ITEMS.filter(i=>cart[key(i)]).map(i=>{const n=cart[key(i)],p=price(i);return {i,n,p,s:p==null?0:n*p}})}
function total(){return lines().reduce((a,l)=>a+l.s,0)}
function unpriced(){return lines().some(l=>l.p==null)}
function underN(l){return !capped(l.i)&&l.n>l.i.q?l.n-Math.max(l.i.q,0):0}
function renderCart(){
  const Ls=lines(), cnt=Ls.reduce((a,l)=>a+l.n,0), t=L();
  $("#cnt").textContent=cnt?t.inCart(cnt):t.empty;
  $("#sum").textContent=fmt(total())+(unpriced()?" +":""); $("#tot").textContent=fmt(total())+(unpriced()?t.plusAsk:"");
  $("#openCart").disabled=!cnt;
  $("#lines").innerHTML=Ls.length?Ls.map(l=>{const u=underN(l),k=esc(key(l.i)),full=capped(l.i)&&l.n>=l.i.q;
    return `<div class="line"><span>${esc(nm(l.i))} × ${l.n}</span><b>${l.p==null?"—":fmt(l.s)}</b><small>${l.p==null?t.ask:t.each(fmt(l.p))}${u?" · "+t.underOrder(u):""}</small><span><span class="step" style="display:inline-flex"><button data-a="-" data-s="${k}" aria-label="−">−</button><span>${l.n}</span><button data-a="+" data-s="${k}" aria-label="+" ${full?"disabled":""}>+</button></span></span></div>`}).join(""):`<p class="hint">${t.cartEmpty}</p>`;
  updSend();
  try{localStorage.setItem("billz-cart",JSON.stringify(cart))}catch(e){}
}
const tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData?Telegram.WebApp:null;
function updSend(){
  const ok=lines().length&&$("#f-shop").value.trim()&&$("#f-phone").value.trim().length>=7;
  $("#submit").disabled=!ok||!tg;
  $("#hint").textContent=!tg?L().notTg:(ok?L().hintOk:L().hintNo);
}
function submit(){
  if(!tg||$("#submit").disabled) return;
  const payload={mode,items:lines().map(l=>({k:key(l.i),n:l.n})),
    client:{shop:$("#f-shop").value.trim(),phone:$("#f-phone").value.trim(),addr:$("#f-addr").value.trim(),
      pay:$("#f-pay").value,inn:mode==="yur"?$("#f-inn").value.trim():"",com:$("#f-com").value.trim()}};
  for(const k in cart) delete cart[k];
  try{localStorage.removeItem("billz-cart")}catch(e){}
  tg.sendData(JSON.stringify(payload));
}
function change(k,a){
  const i=ITEMS.find(x=>key(x)===k); if(!i) return;
  let n=(cart[k]||0)+(a==="+"?1:-1);
  if(capped(i)) n=Math.min(n,i.q);
  n=Math.max(0,n); if(n) cart[k]=n; else delete cart[k];
  renderList(); renderCart();
}
function renderAll(){renderStatic();renderChips();renderList();renderCart()}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(b){if(!b.disabled)change(b.dataset.s,b.dataset.a);return}
  const c=e.target.closest("[data-c]"); if(c){cur=c.dataset.c;renderChips();renderList();return}
});
$("#openCart").onclick=()=>{$("#sheet").classList.add("on");renderCart()};
$("#close").onclick=()=>$("#sheet").classList.remove("on");
$("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#sheet").classList.remove("on")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#sheet").classList.remove("on")});
["#f-phone","#f-shop","#f-com","#f-inn","#f-addr"].forEach(s=>$(s).addEventListener("input",updSend));
$("#submit").onclick=submit;
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
$("#m-fiz").onclick=()=>{mode="fiz";store("billz-mode",mode);renderAll()};
$("#m-yur").onclick=()=>{mode="yur";store("billz-mode",mode);renderAll()};
$("#l-ru").onclick=()=>{lang="ru";store("billz-lang",lang);renderAll()};
$("#l-uz").onclick=()=>{lang="uz";store("billz-lang",lang);renderAll()};
try{
  const s=JSON.parse(localStorage.getItem("billz-cart")||"{}");
  for(const k in s){const i=ITEMS.find(x=>key(x)===k); if(i) cart[k]=capped(i)?Math.min(s[k],i.q):s[k]; if(!cart[k]) delete cart[k];}
  if(localStorage.getItem("billz-mode")==="yur") mode="yur";
  const sl=localStorage.getItem("billz-lang"); lang=sl==="uz"||sl==="ru"?sl:((navigator.language||"").toLowerCase().startsWith("uz")?"uz":"ru");
}catch(e){}
if(tg){tg.ready();tg.expand();
  try{if(!localStorage.getItem("billz-lang")&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.language_code==="uz")lang="uz"}catch(e){}
  document.documentElement.setAttribute("data-theme",tg.colorScheme==="dark"?"dark":"light");}
renderAll();
if(CATALOG_URL.startsWith("http")){
  fetch(CATALOG_URL+"?action=catalog").then(r=>r.json()).then(d=>{
    if(!d||!Array.isArray(d.items)||!d.items.length) return;
    ITEMS=d.items.map(toItem); cats=[...new Set(ITEMS.map(i=>i.c))];
    if(cur!=="*"&&!cats.includes(cur)) cur="*";
    for(const k in cart){const i=ITEMS.find(x=>key(x)===k); if(!i) delete cart[k]; else if(capped(i)) {cart[k]=Math.min(cart[k],i.q); if(!cart[k]) delete cart[k];}}
    if(d.updated) STOCK_DATE=d.updated;
    renderAll();
  }).catch(()=>{});
}
</script>
</body>
